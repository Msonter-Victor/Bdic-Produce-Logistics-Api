server:
  port: 8987

spring:
  config:
    import: secrets.properties
  application:
    name: BOT-SERVICE
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Twilio Configuration
twilio:
  account-sid: ${TWILLIO_ACCOUNT_SID}
  auth-token: ${TWILLIO_AUTH_TOKEN}
  api-key: ${TWILLIO_API_KEY}
  api-secret: ${TWILLIO_API_SECRET}

# Call Configuration
call:
  timeout-seconds: 45
  notification-timeout: 45

logging:
  level:
    dev.gagnon: DEBUG