server:
  port: 8081
  address: 0.0.0.0

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      httpclient:
        websocket:
          max-frame-payload-length: 1048576
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**, /api/cart/**, /api/dispute/**, /api/coupon/**, /api/payout/**, /api/refund/**
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/mail/**, /api/notification/**
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**
        - id: logistics-service
          uri: lb://LOGISTICS-SERVICE
          predicates:
            - Path=/api/logistics/**
        - id: chat-service
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/api/chat/**

        - id: call-service-websocket
          uri: lb://CALL-SERVICE
          predicates:
            - Path=/ws, /ws/**, /api/ws, /api/ws/**
          metadata:
            connect-timeout: 30000
            response-timeout: 30000

        - id: call-service
          uri: lb://CALL-SERVICE
          predicates:
            - Path=/api/calls/**, /health
            -
#            - id: call-service
#              uri: lb://CALL-SERVICE
#              predicates:
#                - Path=/api/video-calls/**, /ws/video-call/**




        - id: bot-service
          uri: lb://BOT-SERVICE
          predicates:
            - Path=/api/bot/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**,/api/auth/**,/api/roles/**,/api/otp/**
        - id: vendor-service
          uri: lb://VENDOR-SERVICE
          predicates:
            - Path=/api/council-wards/**,/api/local-governments/**,/api/markets/**,/api/market-sections/**,/api/states/**,/api/statuses/**,/api/shops/**,/api/categories/**,/api/products/**, /api/review/**,/api/promotions/**

eureka:
  client:
    hostname: localhost
    prefer-ip-address: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

